type: http
name: List customer subscriptions
url: '{{baseUrl}}/customers/:customerId/subscriptions'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: customerId
    value: CUST-10001
scripts:
  - type: afterResponse
    code:
      - // [Smoke] Auto-generated test assertions
      - pm.test('Status code is successful (2xx)', function () {
      - '    pm.response.to.be.success;'
      - '});'
      - pm.test('Response time is acceptable', function () {
      - '    var threshold = parseInt(pm.environment.get(''RESPONSE_TIME_THRESHOLD'') || ''2000'', 10);'
      - '    pm.expect(pm.response.responseTime).to.be.below(threshold);'
      - '});'
      - pm.test('Response body is not empty', function () {
      - '    if (pm.response.code !== 204) {'
      - '        var body = pm.response.text();'
      - '        pm.expect(body.length).to.be.above(0);'
      - '    }'
      - '});'
    language: text/javascript
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "customerId": "CUST-10001",
            "subscriptions": [
              {
                "subscriptionId": "SUB-5001",
                "productCode": "FIBRE-1500",
                "productName": "Fibre Internet 1.5 Gig",
                "category": "internet",
                "status": "active",
                "serviceAddress": {
                  "line1": "100 King Street West",
                  "city": "Toronto",
                  "province": "ON",
                  "postalCode": "M5X 1A9",
                  "countryCode": "CA"
                },
                "activatedAt": "2025-09-18T14:12:00Z"
              },
              {
                "subscriptionId": "SUB-5002",
                "productCode": "MOB-5G-60",
                "productName": "5G Share 60GB",
                "category": "mobile",
                "status": "active",
                "msisdn": "+14165550184",
                "activatedAt": "2024-11-04T18:22:00Z"
              }
            ]
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Active and recently changed customer subscriptions
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "errorCode": "NOT_FOUND",
            "message": "Resource not found.",
            "correlationId": "corr-1e947fbb"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: The requested resource was not found
