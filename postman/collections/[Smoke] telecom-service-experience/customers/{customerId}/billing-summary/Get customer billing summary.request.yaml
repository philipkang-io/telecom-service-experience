type: http
name: Get customer billing summary
url: '{{baseUrl}}/customers/:customerId/billing-summary'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: customerId
    value: CUST-10001
scripts:
  - type: afterResponse
    code:
      - // [Smoke] Auto-generated test assertions
      - pm.test('Status code is successful (2xx)', function () {
      - '    pm.response.to.be.success;'
      - '});'
      - pm.test('Response time is acceptable', function () {
      - '    var threshold = parseInt(pm.environment.get(''RESPONSE_TIME_THRESHOLD'') || ''2000'', 10);'
      - '    pm.expect(pm.response.responseTime).to.be.below(threshold);'
      - '});'
      - pm.test('Response body is not empty', function () {
      - '    if (pm.response.code !== 204) {'
      - '        var body = pm.response.text();'
      - '        pm.expect(body.length).to.be.above(0);'
      - '    }'
      - '});'
    language: text/javascript
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "customerId": "CUST-10001",
            "accountNumber": "BA-70004567",
            "billingCycleDay": 17,
            "balance": {
              "amount": 142.38,
              "currency": "CAD"
            },
            "pastDue": {
              "amount": 0,
              "currency": "CAD"
            },
            "paymentDueDate": "2026-05-17",
            "autopayEnabled": true,
            "latestInvoice": {
              "invoiceId": "INV-2026-0421",
              "issuedDate": "2026-04-21",
              "invoiceTotal": {
                "amount": 142.38,
                "currency": "CAD"
              },
              "status": "issued"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Current customer billing state
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "errorCode": "NOT_FOUND",
            "message": "Resource not found.",
            "correlationId": "corr-1e947fbb"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: The requested resource was not found
